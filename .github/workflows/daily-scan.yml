name: Daily Trends sweep

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel cron (resume batch)
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "CRON_URL not set — skip (Vercel cron still runs)."
            exit 0
          fi
          for i in 1 2 3; do
            echo "sweep $i"
            curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "${CRON_URL}?batch=16" || true
            sleep 20
          done
